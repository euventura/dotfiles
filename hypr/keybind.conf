
$mod = SUPER


# window manipulation
bind = $mod, SPACE, exec, $menu
bind = $mod, RETURN, exec, $terminal
bind = $mod, L, exit
bind = $mod, W , fullscreen
bind = $mod, DOWN, movefocus, d
bind = $mod, UP, movefocus, u
bind = $mod, M, layoutmsg, swapwithmaster master
bind = $mod SHIFT, 0, layoutmsg, mfact +0.1
bind = $mod SHIFT, 9, layoutmsg, mfact -0.1
bind = $mod, TAB, layoutmsg, cyclenext
bind = $mod, UP, layoutmsg, orientationtop
bind = $mod, P, togglefloating

#programs
bind = $mod SHIFT, F, exec, $fileManager
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, C, exec, code
bind = $mod SHIFT, T, exec, txt
bind = $mod SHIFT, M, exec, alacritty -e micro
bind = $mod SHIFT, N, exec, nautilus

#workspace 
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, TAB, workspace, +1

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, TAB, movetoworkspace, +1


bind = , PRINT, exec, grimblast -n -f copysave area
bind = $mod, PRINT, exec, export GRIMBLAST_EDITOR=gthumb; grimblast -n edit area

bind = $mod, mouse_down, layoutmsg, orientationcycle
bind = $mod SHIFT, LEFT, layoutmsg, orientationleft
bind = $mod SHIFT, UP, layoutmsg, orientationtop
bind = $mod SHIFT, DOWN, layoutmsg, mfact exact 1
bind = $mod SHIFT, RIGHT, layoutmsg, mfact exact 0.55

# Laptop keys
bindel = ,XF86AudioRaiseVolume, exec, $volume --inc
bindel = ,XF86AudioLowerVolume, exec, $volume --dec
bindel = ,XF86AudioMute, exec, $volume --toggle
bindel = ,XF86AudioMicMute, exec, $volume --toggle-mic
bindel = ,XF86MonBrightnessUp, exec, $bright --inc
bindel = ,XF86MonBrightnessDown, exec, $bright --dec

#playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous