
$mod = SUPER

# window manipulation
bind = $mod, SPACE, exec, $menu
bind = $mod, RETURN, exec, $terminal
bind = $mod SHIFT, L, exit
bind = $mod, L, exec, hyprlock

bind = $mod, W , fullscreen
bind = $mod, DOWN, movefocus, d
bind = $mod, UP, movefocus, u
bind = $mod, M, layoutmsg, swapwithmaster master
bind = $mod SHIFT, 0, layoutmsg, mfact +0.1
bind = $mod SHIFT, 9, layoutmsg, mfact -0.1
bind = $mod, TAB, layoutmsg, cyclenext
bind = $mod, UP, layoutmsg, orientationtop
bind = $mod, P, togglefloating

#programs
bind = $mod SHIFT, F, exec, $fileManager
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, D, exec, code
bind = $mod SHIFT, T, exec, txt
bind = $mod SHIFT, M, exec, kitty -e micro
bind = $mod SHIFT, N, exec, nautilus
bind = $mod SHIFT, KP_Multiply, exec, gnome-calculator


#workspace
bind = $mod, 1, workspace, 5
bind = $mod, 2, workspace, 6
bind = $mod, 3, workspace, 7
bind = $mod, 4, workspace, 8


bind = $mod CTRL, 1, workspace, 1
bind = $mod CTRL, 2, workspace, 2
bind = $mod CTRL, 3, workspace, 3
bind = $mod CTRL, 4, workspace, 4

bind = $mod, TAB, workspace, +1
bind = $mod SHIFT, TAB, movetoworkspace, -1

bind = $mod SHIFT, 1, movetoworkspace, 5
bind = $mod SHIFT, 2, movetoworkspace, 6
bind = $mod SHIFT, 3, movetoworkspace, 7
bind = $mod SHIFT, 4, movetoworkspace, 8
bind = $mod CTRL SHIFT, 1, movetoworkspace, 1
bind = $mod CTRL SHIFT, 2, movetoworkspace, 2
bind = $mod CTRL SHIFT, 3, movetoworkspace, 3
bind = $mod CTRL SHIFT, 4, movetoworkspace, 4

bind = , PRINT, exec, grimblast -n -f copysave area
bind = $mod, PRINT, exec, export GRIMBLAST_EDITOR=feh; grimblast -n edit area
bind = $mod SHIFT, F6, exec, export GRIMBLAST_EDITOR=feh; grimblast -n edit area
bind = $mod, F6, exec, grimblast -n -f copysave area


bind = $mod, mouse_down, layoutmsg, orientationcycle
bind = $mod SHIFT, LEFT, layoutmsg, orientationleft
bind = $mod SHIFT, UP, layoutmsg, orientationtop
bind = $mod SHIFT, DOWN, layoutmsg, mfact exact 1
bind = $mod SHIFT, RIGHT, layoutmsg, mfact exact 0.55

# Laptop keys
bindel = $mod,XF86AudioRaiseVolume, exec, $volume --inc
bindel = $mod,XF86AudioLowerVolume, exec, $volume --dec
bindel = $mod, F1, exec, $volume --toggle
bindel = $mod,F2, exec, $bright --dec
bindel = $mod,F3, exec, $bright --inc

bindel = $mod,F7, exec, asusctl leds prev
bindel = $mod,F8, exec, asusctl leds next



#playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


bindl = $mod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy


# Volume / Audio
bindl = , xf86audioraisevolume, exec, wpctl set-volume  $volume --inc
bindl = , xf86audiolowervolume, exec, wpctl set-volume $volume --dec
bindl = , xf86audiomute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , xf86audiomicmute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brilho da Tela
bindl = , xf86MonBrightnessUp, exec, $bright --inc
bindl = , xf86MonBrightnessDown, exec, $bright --dec
bindl = , XF86Launch1, exec, asusctl profile next
bindl = , XF86Launch4, exec, asusctl profile next
