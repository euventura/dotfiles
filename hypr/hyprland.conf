################
### MONITORS ###
################

monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = eDP-1, 1920x1080, 0x1080, 1


###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = alacritty
$fileManager = nautilus
$menu = hyprlauncher -d

$volume = $HOME/.config/hypr/scripts/volume.sh
$bright = $HOME/.config/hypr/scripts/bright.sh

#################/home/euventura/.config/rofi/config.rasi
### AUTOSTART ###
#################

exec-once = waybar &
exec-once = wl-paste --watch cliphist store
exec-once = nm-applet &
exec-once = blueberry-tray &
exec-once = dunst &
exec-once = hyprpaper &

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

###################
### PERMISSIONS ###
###################

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################
source = ~/.config/hypr/decoration.conf

xwayland {
    force_zero_scaling = true
    use_nearest_neighbor = true
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = slave
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

input {
    kb_layout = br
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 2

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
    accel_profile = flat
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################
source = ~/.config/hypr/keybind.conf

##############################
### WINDOWS AND WORKSPACES ###
##############################

# windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1


windowrule = match:class (Godot$), tile 1 focus_on_activate
windowrule = match:class ((.*)(DEBUG)), tile 1 focus_on_activate
windowrule = match:title ((.*)(DEBUG)), tile 1 focus_on_activate
windowrule = match:class (steam_app_(.*)), fullscreen workspace 4 focus_on_activate
windowrule = match:class (org.gnome.Calculator), float true focus_on_activate
windowrule = match:class (org.pulseaudio.pavucontrol), float true focus_on_activate
windowrule = match:class (blueberry.py), float true focus_on_activate
windowrule = match:class (kitty), float true focus_on_activate
# windowrule = match:class org.gnome.Calculator, float 1 center 1
